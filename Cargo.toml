[package]
name = "external-dns-webhook-timeweb"
version = "0.5.0"
edition = "2024"
description = "ExternalDNS webhook provider for Timeweb Cloud"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
futures-util = "0.3"
humantime = "2.2"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
